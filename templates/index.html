<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pad Machine Control</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; max-width: 500px; margin: auto; background: #f4f4f9; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; text-align: left; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        select, input { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin-top: 15px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        .btn-home { background: #ff9800; color: white; }
        .btn-test { background: #2196F3; color: white; }
        .btn-auto { background: #4CAF50; color: white; }
        .btn-stop { background: #f44336; color: white; font-size: 24px; padding: 30px; box-shadow: 0 4px 15px rgba(244,67,54,0.4); }
        
        .progress-text { font-size: 64px; font-weight: bold; color: #333; text-align: center; margin: 30px 0; }
        .status-header { font-size: 24px; color: #666; margin-bottom: 20px; text-align: center; font-weight: bold;}
        
        /* Spinner */
        .loader { border: 8px solid #f3f3f3; border-top: 8px solid #3498db; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin: 30px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    
    <!-- Import Map for Vue 3 ES Modules -->
    <script type="importmap">
      {
        "imports": {
          "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
        }
      }
    </script>
</head>
<body>
    <div id="app">
        <!-- Vue App Mounts Here -->
    </div>
    
    <!-- Load Main Vue App -->
    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
